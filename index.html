<script>
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const K='ht_v1';let S;
const uid=()=>crypto.randomUUID().slice(0,12),today=()=>{const d=new Date();return [d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-')};
const dd=d=>Math.floor((new Date(today())-new Date(d))/864e5),fd=d=>d?d.split('-').reverse().slice(0,2).join('/'):'';
const add=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x.toISOString().slice(0,10)};
const T=['sessions','plants','events','lots','tasks','env','recipes','crosses'];
const TB={events:'plant_events',env:'environmental_readings',recipes:'feeding_recipes',crosses:'pollinations'};
let sb,snap={},me,urls={};const PH='data:image/gif;base64,R0lGODlhAQABAAAAACw=';
const I=x=>!x?'':x.startsWith('data:')?`src="${x}"`:`src="${urls[x]||PH}" data-p="${x}"`;
async function hyd(){const im=[...document.querySelectorAll('img[data-p]')].filter(i=>!urls[i.dataset.p]);const P=[...new Set(im.map(i=>i.dataset.p))];
if(P.length){const{data}=await sb.storage.from('photos').createSignedUrls(P,3600);(data||[]).forEach(r=>{if(r.signedUrl)urls[r.path]=r.signedUrl})}
document.querySelectorAll('img[data-p]').forEach(i=>{if(urls[i.dataset.p])i.src=urls[i.dataset.p]})}
function norm(){S.plants.forEach(p=>{p.uuid=p.uuid||crypto.randomUUID();p.rate=p.rate||{};p.terp=p.terp||{top:'',mid:'',base:''}});const m={};S.plants.forEach(p=>m[p.id]=p.uuid);S.events.forEach(e=>{if(!e.puid&&m[e.pid])e.puid=m[e.pid]})}
async function load(){S={};for(const t of T){S[t]=[];const{data,error}=await sb.from(TB[t]||t).select(t==='plants'?'id,data,uuid':'id,data');if(error)throw new Error('Chargement '+t+' : '+error.message);
S[t]=data.map(r=>t==='plants'?{...r.data,uuid:r.uuid}:r.data);S[t].forEach(o=>snap[t+o.id]=JSON.stringify(o))}norm()}
const setSync=t=>{$('#sync').textContent=t};
let busy=Promise.resolve();function save(){norm();setSync('Sauvegarde…');busy=busy.then(sync).then(()=>setSync('Sauvegardé')).catch(e=>{setSync('Échec · réessayer');toast('Erreur de sauvegarde : '+(e.message||e))})}
window.addEventListener('online',()=>{if(S&&me)save()});
async function sync(){const seen=new Set();for(const t of T)for(const o of S[t]){seen.add(t+o.id);
if(t==='events'&&o.photo?.startsWith('data:')){const b=await(await fetch(o.photo)).blob(),path=me+'/'+o.id+'.jpg',{error}=await sb.storage.from('photos').upload(path,b,{contentType:'image/jpeg',upsert:true});if(error)throw error;o.photo=path}
const j=JSON.stringify(o);if(snap[t+o.id]!==j){const row={user_id:me,id:o.id,data:o};if(t==='plants')row.uuid=o.uuid;const{error}=await sb.from(TB[t]||t).upsert(row,{onConflict:'user_id,id'});if(error)throw error;snap[t+o.id]=j}}
for(const k of Object.keys(snap))if(!seen.has(k)){const t=T.find(x=>k.startsWith(x)),{error}=await sb.from(TB[t]||t).delete().eq('id',k.slice(t.length));if(error)throw error;delete snap[k]}}
function demo(){const s1={id:'s1',name:'Session 90×90 — Septembre 2026',start:add(today(),-18),flip:add(today(),4),space:'90×90',light:'LED 240 W',medium:'Coco',pot:'11 L',notes:''};
const V=[['Legendary OG Diesel','LOGD'],['Purple Snowman','PSM'],['Rocket Sauce','RS'],['Orange Fritter','OF'],['Skunk Jam','SJ']];const P=[],E=[];
V.forEach(([n,c],i)=>[1,2].forEach(k=>{const id=`HT-${c}-2609-0${k}`;P.push({id,variety:n,num:k,sess:'s1',pheno:'',status:'Active',type:'Seed',breeder:'',mother:'',father:'',germ:s1.start,flip:'',pot:'11 L',space:'90×90',keeper:false,rate:{},terp:{top:'',mid:'',base:''},parent:''});
E.push({id:uid(),pid:id,date:s1.start,cat:'Germination',text:'Graine germée'},{id:uid(),pid:id,date:add(s1.start,10),cat:'Rempotage',text:'Passage en 3 L',v:{Pot:'3 L'}})}));
E.push({id:uid(),pid:'HT-PSM-2609-01',date:add(today(),-3),cat:'Observation',text:'Forte odeur agrumes + gas'});
P.find(p=>p.id==='HT-PSM-2609-01').flag=1;
return{sessions:[s1],plants:P,events:E,lots:[]}}
function toast(m){const t=document.createElement('div');t.textContent=m;t.style.cssText='position:fixed;top:80px;left:50%;transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:99px;z-index:50;font-weight:600';document.body.append(t);setTimeout(()=>t.remove(),2200)}
const sess=id=>S.sessions.find(s=>s.id===id),plant=id=>S.plants.find(p=>p.uuid===id||p.id===id),evs=id=>{const p=plant(id);return p?S.events.filter(e=>e.puid===p.uuid||!e.puid&&e.pid===p.id).sort((a,b)=>a.date<b.date?-1:1):[]},_s=x=>x.sort((a,b)=>a.date<b.date?-1:1);
function stage(p){const s=sess(p.sess),f=p.flip||s?.flip;if(p.status==='Récoltée')return(p.post||'Récoltée').toUpperCase();if(f&&f<=today())return'FLORAISON J'+dd(f);return'CROISSANCE J'+dd(p.germ)}
const isFlo=p=>stage(p).startsWith('FLO');
const issues=p=>evs(p.id).filter(e=>e.cat==='Problème'&&!e.v?.Résolu);
const hasAlert=p=>issues(p).length>0;
const live=p=>!['Rejetée','Archivée','Récoltée'].includes(p.status);
// routing
const R=()=>location.hash.slice(1)||'/';
window.onhashchange=()=>S&&render();
function nav(){const r=R();$('#nav').innerHTML=[['/','Accueil'],['/plants','Plantes'],['/scan','Scanner'],['/sessions','Sessions'],['/more','Plus']].map(([h,l])=>`<a href="#${h}" class="${r===h?'on':''}">${l}</a>`).join('')}
function render(){nav();const r=R().split('/').filter(Boolean),a=$('#app');scrollTo(0,0);$('#app').onclick=null;stopScan();
$('#fab').style.display=r[0]==='t'||r[0]==='scan'?'none':'block';
if(r[0]==='p')return plantPage(r[1]);if(r[0]==='t')return trace(r[1]);
({undefined:home,plants:plantsPage,scan:scanPage,sessions:sessionsPage,more:morePage,session:sessionPage,keepers:()=>plantsPage('keeper'),lots:lotsPage,tasks:tasksPage,recipes:recipesPage,pheno:phenoPage,breeding:breedingPage,env:envPage}[r[0]]||home)(r[1])}
function ev(e){const v=e.v?Object.entries(e.v).map(([k,x])=>`${esc(k)} ${esc(x)}`).join(' · '):'';return`<div class="ev"><div class="mute">${fd(e.date)}</div><b>${esc(e.cat)}</b>${e.text?'<div>'+esc(e.text)+'</div>':''}${v?'<div class="mute">'+v+'</div>':''}${e.photo?`<img ${I(e.photo)}>`:''}${e.pid?'':''}</div>`}
function pcard(p){return`<a class="card" href="#/p/${p.uuid}"><div class="mute">${esc(p.id)}</div><b style="font-size:18px">${esc(p.variety)} #${String(p.num).padStart(2,'0')}</b> ${p.keeper?'★':''}<div class="${hasAlert(p)?'warn':'mute'}">${stage(p)}${hasAlert(p)?' · ⚠ problème actif':''} · ${esc(p.status)}</div></a>`}
function home(){const A=S.plants.filter(live),act=S.sessions.filter(s=>!s.archived),al=A.filter(hasAlert);
const soon=A.filter(p=>isFlo(p)&&dd(p.flip||sess(p.sess)?.flip)>=49);
const last=[...S.events].sort((a,b)=>a.date<b.date?1:-1);
$('#app').innerHTML=`<h1>Aujourd'hui</h1><div class="grid" style="margin-top:14px">
<div class="card stat"><b>${A.length}</b><span>plantes actives</span></div><div class="card stat"><b>${act.length}</b><span>sessions actives</span></div>
<div class="card stat"><b>${A.filter(p=>!isFlo(p)).length}</b><span>en croissance</span></div><div class="card stat"><b>${A.filter(isFlo).length}</b><span>en floraison</span></div>
<div class="card stat"><b>${soon.length}</b><span>à récolter bientôt</span></div><div class="card stat"><b class="${al.length?'warn':''}">${al.length}</b><span>avec alerte</span></div></div>
<h2>Alertes</h2>${al.map(p=>`<a class="card warn" href="#/p/${p.id}"><b>${esc(p.variety)} #${p.num}</b><br>${esc(issues(p)[0].text||issues(p)[0].v?.Type||'Problème actif')}</a>`).join('')||'<div class="card mute">Aucune alerte.</div>'}
${nextTasksHtml()}<h2>Sessions</h2>${act.map(sc=>sessCard(sc)).join('')||'<div class="card mute">Crée ta première session dans l\'onglet Sessions.</div>'}
<h2>Dernières observations</h2>${last.filter(e=>e.cat==='Observation').slice(0,3).map(e=>`<a class="card" href="#/p/${e.pid}"><div class="mute">${esc(e.pid)} · ${fd(e.date)}</div>${esc(e.text)}</a>`).join('')||'<div class="card mute">Rien pour l\'instant.</div>'}
<h2>Dernières photos</h2><div class="thumbs">${last.filter(e=>e.photo).slice(0,6).map(e=>`<a href="#/p/${e.pid}"><img ${I(e.photo)}></a>`).join('')}</div>`}
function sessCard(s){const P=S.plants.filter(p=>p.sess===s.id&&live(p)),c={};P.forEach(p=>c[p.variety]=(c[p.variety]||0)+1);
const fl=s.flip&&s.flip<=today(),until=s.flip?Math.max(0,-dd(s.flip)):0;
return`<a class="card" href="#/session/${s.id}"><b style="font-size:18px">${esc(s.name)}</b><div>${P.length} plantes</div><div class="mute">${fl?'Floraison J'+dd(s.flip):'Croissance J'+dd(s.start)}${!fl&&s.flip?` · floraison prévue dans ${until} j`:''}</div><div style="margin-top:8px">${Object.entries(c).map(([k,v])=>`<div>${esc(k)} ×${v}</div>`).join('')}</div></a>`}
function plantsPage(f){let q='',flt=f==='keeper'?'keeper':'all';const a=$('#app');
const draw=()=>{const L=S.plants.filter(p=>{const s=sess(p.sess);const t=[p.id,p.variety,s?.name,p.breeder,p.pheno,p.mother].join(' ').toLowerCase();if(q&&!t.includes(q))return false;
return flt==='all'?true:flt==='grow'?live(p)&&!isFlo(p):flt==='flo'?live(p)&&isFlo(p):flt==='keeper'?p.keeper||p.status==='Keeper':flt==='alert'?hasAlert(p):flt==='soon'?isFlo(p)&&dd(p.flip||s?.flip)>=49:true});
$('#pl').innerHTML=L.map(pcard).join('')||'<div class="card mute">Aucune plante ne correspond.</div>'};
a.innerHTML=`<h1>Plantes</h1><input id="q" placeholder="Rechercher ID, variété, session, breeder, phéno, mère…" style="margin-top:12px"><div class="tabs" id="ft">${[['all','Toutes'],['grow','Croissance'],['flo','Floraison'],['keeper','Keepers'],['alert','Problème'],['soon','Récolte proche']].map(([k,l])=>`<span class="pill ${k===flt?'on':''}" data-k="${k}">${l}</span>`).join('')}</div><div id="pl"></div><button id="np" style="width:100%">Nouvelle plante</button>`;
draw();$('#q').oninput=e=>{q=e.target.value.toLowerCase();draw()};$('#ft').onclick=e=>{const k=e.target.dataset.k;if(!k)return;flt=k;[...$('#ft').children].forEach(x=>x.classList.toggle('on',x.dataset.k===k));draw()};$('#np').onclick=()=>newPlant()}
const pl=p=>`${p.variety} #${String(p.num).padStart(2,'0')}`,addEv=(p,cat,text,v,date)=>S.events.push({id:uid(),pid:p.id,puid:p.uuid,date:date||today(),cat,text:text||'',v});
const RK=['vigueur','structure','stretch','production','densité','résine','couleur','facilité','résistance','odeur','goût','effet','breeding'];
const score=p=>{const v=RK.map(k=>+p.rate[k]).filter(Boolean);return v.length?+(v.reduce((a,b)=>a+b)/v.length).toFixed(1):0};
function mkPlant(d,base){const s=sess(d.sess),dt=(s&&s.start)||today(),code=d.variety.split(/\s+/).map(w=>w[0]).join('').toUpperCase().slice(0,4),ym=dt.slice(2,4)+dt.slice(5,7),isC=d.type==='Clone'&&base;
const mk=n=>isC?`HT-${code}-C${String(n).padStart(2,'0')}`:`HT-${code}-${ym}-${String(n).padStart(2,'0')}`;let n=1;while(S.plants.some(p=>p.id===mk(n)))n++;
const p={id:mk(n),uuid:crypto.randomUUID(),variety:d.variety,num:n,sess:d.sess,pheno:d.pheno||'',status:'Active',type:d.type,breeder:d.breeder||'',mother:d.mother||'',father:d.father||'',germ:d.germ||today(),flip:'',pot:d.pot||'',space:d.space||'',keeper:false,rate:{},terp:{top:'',mid:'',base:''},parent:base?base.id:''};
S.plants.push(p);addEv(p,isC?'Bouturage':'Germination',isC?'Clone de '+base.id:'',undefined,p.germ);return p}
function newPlant(base){if(!S.sessions.length)return toast('Crée d\'abord une session');
form('Nouvelle plante',[{k:'variety',l:'Variété',v:base?.variety||''},{k:'sess',l:'Session',t:'select',o:S.sessions.map(s=>[s.id,s.name]),v:base?.sess},{k:'type',l:'Type',t:'select',o:['Seed','Clone','Mère','Sélection'].map(x=>[x,x]),v:base?'Clone':'Seed'},{k:'germ',l:'Date de départ / bouturage',t:'date',v:today()},{k:'breeder',l:'Breeder',v:base?.breeder||''},{k:'pheno',l:'Phénotype',v:base?.pheno||''},{k:'mother',l:'Mère génétique',v:base?.mother||''},{k:'father',l:'Père génétique',v:base?.father||''},{k:'pot',l:'Pot',v:'1 L'},{k:'space',l:'Emplacement',v:base?.space||''}],d=>{
if(!d.variety)return toast('Variété requise');const p=mkPlant(d,base);save();location.hash='/p/'+p.uuid})}
const TT=['Arrosage','Traitement','Rempotage','Passage en floraison','Défoliation','Récolte estimée','Personnalisée'];
function virt(){const v=[];S.sessions.filter(s=>!s.archived&&s.flip).forEach(s=>{if(s.flip>=today())v.push({title:'Passage en floraison — '+s.name,due:s.flip,virt:1});v.push({title:'Récolte estimée — '+s.name,due:add(s.flip,63),virt:1})});return v}
const nextTasks=()=>[...S.tasks.filter(t=>!t.done),...virt()].sort((a,b)=>a.due<b.due?-1:1);

const ACTS={Photo:{cat:'Photo',f:[]},Arrosage:{cat:'Arrosage',f:['Volume (L)','Drainage (L)','pH entrée','EC entrée','pH drainage','EC drainage','Temp. eau']},Observation:{cat:'Observation',f:[]},Traitement:{cat:'Traitement',f:['Produit','Dose','Motif']},Taille:{cat:'Taille',f:['Type (apex/topping/LST/palissage/défoliation)']},Rempotage:{cat:'Rempotage',f:['Pot']},Problème:{cat:'Problème',f:['Type','Gravité (1-5)','Traitement','Résultat']},Récolte:{cat:'Récolte',f:['Poids humide (g)','Poids sec (g)']},Séchage:{cat:'Séchage',f:['Température (°C)','Humidité (%)','Durée (jours)','Poids (g)']},Curing:{cat:'Curing',f:['Température (°C)','Humidité (%)','Poids (g)']},Stockage:{cat:'Stockage',f:['Poids (g)','Contenant']},Tâche:{cat:'Tâche',f:[]}};
const POST=['Séchage','Curing','Stockage'];
$('#fab').onclick=()=>{const cur=R().startsWith('/p/')?plant(R().slice(3)):null;if(!S.plants.some(p=>p.status!=='Archivée'))return toast('Crée d’abord une plante');
const m=modal(`<h1 style="font-size:22px;margin-bottom:12px">Action rapide</h1><label>Plante</label><select id="fp">${S.plants.filter(p=>p.status!=='Archivée').map(p=>`<option value="${p.id}" ${p===cur?'selected':''}>${esc(p.variety)} #${p.num} — ${p.id}</option>`).join('')}</select><div class="acts">${Object.keys(ACTS).filter(k=>!POST.includes(k)).map(k=>`<button data-a="${k}">${k}</button>`).join('')}</div>`);
m.onclick=e=>{if(e.target===m)m.remove();const a=e.target.dataset.a;if(!a)return;const pid=m.querySelector('#fp').value;m.remove();act(a,pid)}};
function act(a,pid){if(!plant(pid))return toast('Plante introuvable');if(a==='Tâche')return taskForm(pid);const A=ACTS[a];const multi=['Arrosage','Traitement'].includes(a);
form(a,[{k:'date',l:'Date',t:'date',v:today()},...A.f.map((l,i)=>({k:'f'+i,l,t:/Volume|Drain|pH|EC|Temp|Poids|Humid|Durée/.test(l)?'number':'text'})),{k:'text',l:'Commentaire',t:'textarea'},{k:'photo',l:'Photo',t:'file'},...(a==='Arrosage'&&S.recipes.length?[{k:'rec',l:'Recette',t:'select',o:[['','—'],...S.recipes.map(r=>[r.id,r.name])]}]:[]),...(multi?[{k:'all',l:'Copier sur toute la session',t:'select',o:[['','Non'],['1','Oui']]}]:[])],d=>{
const v={};A.f.forEach((l,i)=>{if(d['f'+i])v[l.replace(/ \(.*\)/,'')]=d['f'+i]});const rc=S.recipes.find(r=>r.id===d.rec);if(rc){v.Recette=rc.name;if(rc.ph&&!v['pH entrée'])v['pH entrée']=rc.ph;if(rc.ec&&!v['EC entrée'])v['EC entrée']=rc.ec}
const tg=d.all?S.plants.filter(p=>p.sess===plant(pid).sess&&live(p)).map(p=>p.id):[pid];
tg.forEach(t=>S.events.push({id:uid(),pid:t,date:d.date,cat:a==='Photo'?'Photo':a,text:d.text,photo:t===pid?d.photo:'',v:Object.keys(v).length?v:undefined}));
if(a==='Récolte'){const p=plant(pid);p.status='Récoltée';p.post=''}if(POST.includes(a))plant(pid).post=a;
save();toast(a+' enregistré'+(tg.length>1?' ×'+tg.length:''));render()})}
// scan
let stream,raf;function stopScan(){cancelAnimationFrame(raf);stream?.getTracks().forEach(t=>t.stop());stream=null}
function scanPage(){$('#app').innerHTML=`<h1>Scanner une plante</h1><video id="v" playsinline muted style="margin-top:14px"></video><div class="mute" id="sm" style="margin:8px 0">Vise le QR de la plante.</div><label>Ou saisis l'ID</label><input id="mi" placeholder="HT-PSM-2609-01"><button id="mg" style="width:100%">Ouvrir</button>`;
const go=t=>{const m=String(t).match(/#\/[pt]\/([^\s#]+)/),id=m?decodeURIComponent(m[1]):String(t).trim();if(plant(id)){stopScan();location.hash=(m&&m[0].startsWith('#/t')?'/t/':'/p/')+id;return true}return false};
$('#mg').onclick=()=>go($('#mi').value)||toast('ID inconnu');
navigator.mediaDevices?.getUserMedia({video:{facingMode:'environment'}}).then(s=>{stream=s;const v=$('#v');v.srcObject=s;v.play();const c=document.createElement('canvas'),x=c.getContext('2d',{willReadFrequently:true});
const tick=()=>{if(v.videoWidth){c.width=v.videoWidth;c.height=v.videoHeight;x.drawImage(v,0,0);const r=jsQR(x.getImageData(0,0,c.width,c.height).data,c.width,c.height);if(r&&go(r.data))return;if(r)$('#sm').textContent='QR lu mais plante inconnue dans cette base.'}raf=requestAnimationFrame(tick)};tick()}).catch(()=>{$('#sm').textContent='Caméra indisponible : autorise l\'accès ou saisis l\'ID.'})}
// sessions
function sessionsPage(){$('#app').innerHTML=`<h1>Sessions</h1><div style="margin-top:14px">${S.sessions.map(s=>sessCard(s)).join('')}</div><button id="ns" style="width:100%">Nouvelle session</button><button id="p90" class="ghost" style="width:100%;margin-top:8px">Préparer ma session 90×90 · 10 plantes</button>`;$('#ns').onclick=()=>sessForm();$('#p90').onclick=()=>preset90()}
function preset90(){if(S.sessions.some(s=>s.preset90))return toast('Cette session est déjà préparée');
form('Session 90×90',[{k:'start',l:'Date réelle de départ',t:'date',v:today()},{k:'medium',l:'Substrat',v:'Coco / perlite'},{k:'pot',l:'Pot de départ',v:'1 L'},{k:'light',l:'Éclairage (optionnel)'},{k:'flip',l:'Passage en floraison prévu (optionnel)',t:'date'}],d=>{
if(!d.start)return toast('Date de départ requise');const s={id:uid(),name:'Sélection Alpine · 90×90',start:d.start,flip:d.flip,space:'90×90',light:d.light,medium:d.medium,pot:d.pot,notes:'2 plantes par variété. Vérifier le nom exact des génétiques avant impression des QR.',preset90:true};S.sessions.push(s);
for(const variety of ['Legendary OG Diesel','Purple Snowman','Rocket Sauce','Orange Fritter','Skunk Jam'])for(let n=0;n<2;n++)mkPlant({variety,sess:s.id,type:'Seed',germ:d.start,pot:d.pot,space:'90×90'});
save();location.hash='/session/'+s.id},'<div class="card mute">Crée 2 Legendary OG Diesel, 2 Purple Snowman, 2 Rocket Sauce, 2 Orange Fritter et 2 Skunk Jam. Corrige les noms au besoin dans chaque fiche.</div>')}
function sessForm(s){const n=!s;s=s||{start:today()};form(n?'Nouvelle session':'Modifier',[{k:'name',l:'Nom',v:s.name},{k:'start',l:'Date de début',t:'date',v:s.start},{k:'space',l:'Espace (90×90, Serre…)',v:s.space},{k:'light',l:'Éclairage / puissance',v:s.light},{k:'medium',l:'Substrat',v:s.medium},{k:'pot',l:'Taille des pots',v:s.pot},{k:'photo',l:'Photopériode',v:s.photo||'18/6'},{k:'flip',l:'Passage en floraison',t:'date',v:s.flip},{k:'notes',l:'Notes',t:'textarea',v:s.notes}],d=>{if(!d.name)return toast('Nom requis');if(n)S.sessions.push({id:uid(),...d});else Object.assign(s,d);save();render()})}
function sessionPage(id){const s=sess(id);if(!s)return home();const P=S.plants.filter(p=>p.sess===id);
$('#app').innerHTML=`<h1>${esc(s.name)}</h1><div class="mute" style="margin:6px 0 14px">${esc(s.space||'')} · ${esc(s.light||'')} · ${esc(s.medium||'')} · pots ${esc(s.pot||'')}${s.archived?' · archivée':''}</div><div class="row" style="margin-bottom:12px"><button class="ghost" id="e1">Modifier</button><button class="ghost" id="e2">${s.archived?'Réactiver':'Archiver'}</button><button class="ghost" id="e3">Exporter CSV</button><button class="ghost" onclick="location.hash='/env/${id}'">Environnement</button></div>${s.notes?`<div class="card">${esc(s.notes)}</div>`:''}${P.map(pcard).join('')}<button id="e4" class="danger" style="width:100%;margin-top:14px">Supprimer la session</button>`;
$('#e1').onclick=()=>sessForm(s);$('#e2').onclick=()=>{s.archived=!s.archived;save();render()};
$('#e3').onclick=()=>save2(s.name.replace(/\W+/g,'_')+'.csv',new Blob([csv(P)],{type:'text/csv'}));
$('#e4').onclick=()=>{if(P.length)return toast('Supprime ou déplace d\'abord les plantes');if(confirm('Supprimer ?')){S.sessions=S.sessions.filter(x=>x!==s);save();location.hash='/sessions'}}}
const csv=P=>{const q=x=>'"'+String(x??'').replace(/"/g,'""')+'"';return['id,variété,n°,statut,stade,âge,pot,breeder,phéno'].concat(P.map(p=>[p.id,p.variety,p.num,p.status,stage(p),dd(p.germ),p.pot,p.breeder,p.pheno].map(q).join(','))).join('\n')};
// lots & more
function lotsPage(){const H=S.plants.filter(p=>p.status==='Récoltée');$('#app').innerHTML=`<h1>Lots</h1><div style="margin-top:14px">${S.lots.map(l=>`<div class="card"><b>${esc(l.name)}</b> · ${esc(l.code)}<div>${l.weight} g</div><div class="mute">${l.plants.map(esc).join(', ')}</div></div>`).join('')||'<div class="card mute">Aucun lot. Récolte des plantes pour en créer un.</div>'}</div><button id="nl" style="width:100%">Nouveau lot</button>`;
$('#nl').onclick=()=>{if(!H.length)return toast('Aucune plante récoltée');form('Nouveau lot',[{k:'name',l:'Nom du lot (ex. Blue Meringue)'},{k:'code',l:'Code lot',v:'LOT-'+today().slice(2,4)+today().slice(5,7)+'-01'},{k:'weight',l:'Poids total (g)',t:'number'}],d=>{S.lots.push({id:uid(),...d,plants:[...document.querySelectorAll('.lp:checked')].map(x=>x.value)});save();render()},`<label>Plantes récoltées incluses</label>${H.map(p=>`<div><label style="color:var(--fg)"><input type="checkbox" class="lp" value="${p.id}" style="width:auto;margin-right:8px">${esc(p.id)}</label></div>`).join('')}`)}}
function morePage(){$('#app').innerHTML=`<h1>Plus</h1><div style="margin-top:14px"><a class="card" href="#/tasks">Tâches et rappels</a><a class="card" href="#/recipes">Nutrition</a><a class="card" href="#/pheno">Phénohunt</a><a class="card" href="#/breeding">Breeding</a><a class="card" href="#/keepers">★ Keepers</a><a class="card" href="#/lots">Lots</a><div class="card"><b>Export</b><div class="row" style="margin-top:8px"><button class="ghost" id="x1">CSV toutes les plantes</button><button class="ghost" id="x2">Sauvegarde JSON</button></div></div><div class="card"><b>Données</b><div class="mute" style="margin:6px 0">Base Supabase : synchronisée sur iPhone et ordinateur.</div><button class="danger" id="x3">Charger les données de démo</button><button class="ghost" id="lo" style="width:100%;margin-top:8px">Se déconnecter</button></div></div>`;
$('#x1').onclick=()=>save2('plantes.csv',new Blob([csv(S.plants)],{type:'text/csv'}));$('#x2').onclick=()=>save2('hidden-terps-backup.json',new Blob([JSON.stringify(S)],{type:'application/json'}));$('#lo').onclick=async()=>{await sb.auth.signOut();location.reload()};$('#x3').onclick=()=>{if(confirm('Ajouter les données de démo ?')){if(S.plants.some(p=>p.id==='HT-PSM-2609-01'))return toast('Démo déjà chargée');const d=demo();T.forEach(t=>S[t].push(...(d[t]||[])));save();location.hash='/';render()}}}
$('#th').onclick=()=>{const r=document.documentElement,d=getComputedStyle(r).getPropertyValue('--bg').trim()==='#000';r.dataset.theme=d?'light':'dark'};
function authPage(){$('#fab').style.display='none';$('#app').innerHTML=`<h1 style="margin-top:30px">Connexion</h1><div style="margin-top:16px"><label>Email</label><input id="em" type="email" autocomplete="email"><label>Mot de passe</label><input id="pw" type="password" autocomplete="current-password"><div class="row"><button id="li">Se connecter</button><button class="ghost" id="su">Créer un compte</button></div><div class="mute" id="am" style="margin-top:12px"></div></div>`;
const go=async k=>{const{error}=await sb.auth[k]({email:$('#em').value,password:$('#pw').value});if(error)return $('#am').textContent=error.message;if(k==='signUp'){const{data:{session}}=await sb.auth.getSession();if(!session)return $('#am').textContent='Compte créé : confirme ton email puis connecte-toi.'}location.reload()};
$('#li').onclick=()=>go('signInWithPassword');$('#su').onclick=()=>go('signUp')}
(async()=>{const c=window.HT;if(!c?.url||!c?.key||!window.supabase){$('#app').innerHTML='<div class="card warn">Application indisponible. Vérifie ta connexion et réessaie.</div>';return}
sb=supabase.createClient(c.url,c.key);const{data:{session},error}=await sb.auth.getSession(),r=R().split('/');if(error){$('#app').innerHTML='<div class="card warn">Connexion impossible : '+esc(error.message)+'</div>';return}
if(!session){$('#fab').style.display='none';return r[1]==='t'?trace(r[2]):authPage()}
me=session.user.id;await load();new MutationObserver(hyd).observe($('#app'),{childList:true,subtree:true});setSync('Sauvegardé');render()})().catch(e=>{$('#app').innerHTML='<div class="card warn">Erreur de démarrage : '+esc(e.message)+'</div>'});
</script></body></html>
